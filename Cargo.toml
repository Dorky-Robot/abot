[package]
name = "abot"
description = "The CLI for a git-based ecosystem log: orient, start, land, dead-end, park, ticket"
version = "2.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Dorky-Robot/abot"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
